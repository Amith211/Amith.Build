name: Validate Amith.Build
on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - scripts/**
      - tests/**
      - action.yml
      - setup-nuget/**
      - setup-tools/**
      - .github/workflows/validate.yml
      - .github/workflows/build.yml
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Tool cache unit checks
        run: node --test tests/ToolCacheChecks.cjs
      - name: Cold shared tool setup
        id: tools
        uses: ./setup-tools
        with:
          tool-cache-path: ${{ runner.temp }}/amith-tools-test
      - name: Cached shared tool setup
        uses: ./setup-tools
        with:
          tool-cache-path: ${{ runner.temp }}/amith-tools-test
      - name: Verify tool resolution
        shell: pwsh
        run: |
          pwsh --version
          gh --version
          if ($env:AMITH_TOOL_CACHE -ne '${{ steps.tools.outputs.cache-root }}') { throw 'Tool cache environment was not restored.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unit and integration checks
        shell: pwsh
        run: ./tests/Test-AmithBuild.ps1 -Integration
