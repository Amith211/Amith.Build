name: Validate Amith.Build
on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - scripts/**
      - tests/**
      - action.yml
      - setup-nuget/**
      - setup-tools/**
      - setup-dotnet/**
      - runner-diagnostics/**
      - .github/workflows/validate.yml
      - .github/workflows/build.yml
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 360
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Register diagnostic post-hook integration check
        uses: ./runner-diagnostics
        with:
          keep-runner-alive: 'true'
          keep-runner-alive-minutes: '1'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Node action unit and process checks
        run: node --test tests/ToolCacheChecks.cjs tests/RunnerDiagnosticsChecks.cjs tests/ArtifactRetentionChecks.cjs
      - name: Cold shared tool setup
        id: tools
        uses: ./setup-tools
        with:
          tool-cache-path: ${{ runner.temp }}/amith-tools-test
      - name: Cached shared tool setup
        uses: ./setup-tools
        with:
          tool-cache-path: ${{ runner.temp }}/amith-tools-test
      - name: Verify tool resolution
        shell: pwsh
        run: |
          pwsh --version
          gh --version
          if ($env:AMITH_TOOL_CACHE -ne '${{ steps.tools.outputs.cache-root }}') { throw 'Tool cache environment was not restored.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Bootstrap SDK availability
        uses: ./setup-dotnet
      - name: Reuse cached SDK bootstrap
        uses: ./setup-dotnet
      - name: Verify native SDK policy
        shell: pwsh
        run: dotnet --version
      - name: Unit and integration checks
        shell: pwsh
        run: ./tests/Test-AmithBuild.ps1 -Integration

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up isolated validation builder
        id: builder
        uses: docker/setup-buildx-action@v4
      - name: Verify real multi-platform OCI export and retention
        id: image
        shell: pwsh
        env:
          AMITH_TEST_BUILDER: ${{ steps.builder.outputs.name }}
        run: ./tests/Test-ContainerBuild.ps1 -ContainerBuilder $env:AMITH_TEST_BUILDER
      - name: Prepare local registry test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          sudo install -d /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' | sudo tee /etc/containers/registries.conf.d/amith-test.conf >/dev/null
      - name: Verify real publication, latest and retry
        shell: pwsh
        env:
          AMITH_TEST_ARCHIVE: ${{ steps.image.outputs.archive_path }}
        run: ./tests/Test-ContainerRegistry.ps1 -ArchivePath $env:AMITH_TEST_ARCHIVE -Registry localhost:5000
