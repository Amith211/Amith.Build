name: Shared build and release
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source-ref:
        description: 'Optional source branch, tag or commit to build; empty checks out the calling workflow commit.'
        type: string
        default: ''
      build-mode:
        description: 'all (default) or containers; containers builds mapped test projects and container images only.'
        type: string
        default: all
      config:
        type: string
        default: ''
      solution:
        type: string
        default: ''
      project:
        type: string
        default: ''
      runtimes:
        type: string
        default: ''
      pack-projects:
        type: string
        default: ''
      pack-only-projects:
        type: string
        default: ''
      exclude-pack-projects:
        type: string
        default: ''
      pack-all-libraries:
        type: boolean
        default: false
      no-pack:
        type: boolean
        default: false
      no-tests:
        description: 'Optional true/false declaration of no selected test projects; empty preserves configuration.'
        type: string
        default: ''
      skip-tests:
        description: 'Optional true/false explicit test execution bypass; empty preserves configuration.'
        type: string
        default: ''
      self-contained:
        description: 'Optional true/false override; empty preserves project configuration/defaults.'
        type: string
        default: ''
      single-file:
        description: 'Optional true/false override; empty preserves project configuration/defaults.'
        type: string
        default: ''
      standalone-single-file:
        type: boolean
        default: false
      versioned-archives:
        description: 'Optional true/false archive filename override; empty preserves configuration/defaults.'
        type: string
        default: ''
      unversioned-archives:
        type: boolean
        default: false
      include-symbols:
        description: Optional true/false archive PDB override; empty preserves configuration (default true).
        type: string
        default: ''
      include-development-settings:
        description: Optional true/false development JSON override; empty preserves configuration (default false).
        type: string
        default: ''
      package-excludes:
        description: Additional newline-separated relative file globs.
        type: string
        default: ''
      powershell-tag:
        type: string
        default: ''
      tool-cache-path:
        description: 'Persistent tools root; empty uses /opt/hostedtoolcache on Linux and the runner cache on Windows.'
        type: string
        default: ''
      gh-version:
        description: 'GitHub CLI release version; empty selects latest stable.'
        type: string
        default: ''
      container-builder-endpoint:
        description: Remote BuildKit endpoint used when the plan contains containers.
        type: string
        default: tcp://buildkitd.arc-buildkit.svc:1234
      container-buildx-version:
        description: Optional pinned Buildx version.
        type: string
        default: ''
      runner-group:
        type: string
        default: bcs-runners
      sdk-version:
        description: Build SDK selector; empty preserves project configuration (default auto).
        type: string
        default: ''
      additional-sdks:
        description: Additional comma/newline-separated SDK selectors.
        type: string
        default: ''
      dotnet-version:
        description: Legacy single-selector alias for sdk-version; do not supply both.
        type: string
        default: ''
      keep-runner-alive:
        description: Keep the runner allocated for diagnostics at the end, including after failures.
        type: boolean
        default: false
      keep-runner-alive-minutes:
        description: Whole minutes (1-360), or -1 for all remaining budget.
        type: number
        default: 60
      runner-timeout-margin-minutes:
        description: Whole minutes reserved before the six-hour job limit (1-359).
        type: number
        default: 30
      artifact-retention:
        description: 'Actions package retention: never (default), auto (build-only or release failure), or always.'
        type: string
        default: never
      artifact-retention-days:
        description: 'Whole days (1-400), subject to the repository/organisation retention limit.'
        type: number
        default: 1
      release:
        type: boolean
        default: false
    secrets:
      NUGET_RESTORE_SOURCES:
        description: JSON array of restore sources and optional credentials; distinct from package-publishing credentials.
        required: false
      CONTAINER_REGISTRY_USERNAME:
        required: false
      CONTAINER_REGISTRY_PASSWORD:
        required: false
      NUGET_SOURCE_URL:
        required: false
      NUGET_API_KEY:
        required: false
      RELEASE_TOKEN:
        required: false
jobs:
  build:
    timeout-minutes: 360
    runs-on:
      group: ${{ inputs.runner-group }}
    concurrency:
      # All release versions/refs share one consumer-repository queue.
      # Build-only runs have their own group and never hold the release queue.
      group: ${{ inputs.release && format('amith-build-release-{0}', github.repository) || format('amith-build-check-{0}-{1}-{2}', github.repository, github.run_id, github.run_attempt) }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Register runner diagnostics
        uses: Amith211/Amith.Build/runner-diagnostics@v0.2.0
        with:
          keep-runner-alive: ${{ inputs.keep-runner-alive }}
          keep-runner-alive-minutes: ${{ inputs.keep-runner-alive-minutes }}
          runner-timeout-margin-minutes: ${{ inputs.runner-timeout-margin-minutes }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Ensure Linux compression tools
        if: runner.os == 'Linux' && inputs.build-mode != 'containers'
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update && apt-get install -y zstd
            else
              sudo apt-get update && sudo apt-get install -y zstd
            fi
          fi
          zstd --version
      - name: Set up shared build tools
        uses: Amith211/Amith.Build/setup-tools@v0.2.0
        with:
          powershell-tag: ${{ inputs.powershell-tag }}
          gh-version: ${{ inputs.gh-version }}
          tool-cache-path: ${{ inputs.tool-cache-path || (runner.os == 'Linux' && '/opt/hostedtoolcache' || '') }}
      - name: Validate SDK inputs
        shell: pwsh
        env:
          AMITH_BUILD_MODE: ${{ inputs.build-mode }}
          AMITH_SDK: ${{ inputs.sdk-version }}
          AMITH_LEGACY_SDK: ${{ inputs.dotnet-version }}
        run: |
          if ($env:AMITH_BUILD_MODE -cnotin @('all','containers')) { throw 'build-mode must be all or containers.' }
          if ($env:AMITH_SDK -and $env:AMITH_LEGACY_SDK) { throw 'Use sdk-version or its legacy dotnet-version alias, not both.' }
      - name: Validate artifact retention inputs
        id: retention-policy
        shell: pwsh
        env:
          AMITH_ARTIFACT_RETENTION: ${{ inputs.artifact-retention }}
          AMITH_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
        run: |
          if ($env:AMITH_ARTIFACT_RETENTION -cnotin @('auto', 'always', 'never')) {
            throw 'artifact-retention must be auto, always, or never.'
          }
          $days = 0
          if (![int]::TryParse($env:AMITH_ARTIFACT_RETENTION_DAYS, [ref]$days) -or $days -lt 1 -or $days -gt 400) {
            throw 'artifact-retention-days must be a whole number between 1 and 400, within the repository/organisation retention limit.'
          }
      - name: Bootstrap .NET SDKs
        uses: Amith211/Amith.Build/setup-dotnet@v0.2.0
        with:
          sdk-version: ${{ inputs.sdk-version || inputs.dotnet-version || 'auto' }}
          additional-sdks: ${{ inputs.additional-sdks }}
      - name: Configure NuGet restore feeds
        uses: Amith211/Amith.Build/setup-nuget@v0.2.0
        env:
          AMITH_NUGET_RESTORE_SOURCES: ${{ secrets.NUGET_RESTORE_SOURCES }}
      - name: Plan
        id: plan
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Plan
          build-mode: ${{ inputs.build-mode }}
          config: ${{ inputs.config }}
          solution: ${{ inputs.solution }}
          project: ${{ inputs.project }}
          version: ${{ inputs.version }}
          sdk-version: ${{ inputs.sdk-version || inputs.dotnet-version }}
          additional-sdks: ${{ inputs.additional-sdks }}
          runtimes: ${{ inputs.runtimes }}
          pack-projects: ${{ inputs.pack-projects }}
          pack-only-projects: ${{ inputs.pack-only-projects }}
          exclude-pack-projects: ${{ inputs.exclude-pack-projects }}
          pack-all-libraries: ${{ inputs.pack-all-libraries }}
          no-pack: ${{ inputs.no-pack }}
          no-tests: ${{ inputs.no-tests }}
          skip-tests: ${{ inputs.skip-tests }}
          self-contained: ${{ inputs.self-contained }}
          single-file: ${{ inputs.single-file }}
          standalone-single-file: ${{ inputs.standalone-single-file }}
          versioned-archives: ${{ inputs.versioned-archives }}
          unversioned-archives: ${{ inputs.unversioned-archives }}
          include-symbols: ${{ inputs.include-symbols }}
          include-development-settings: ${{ inputs.include-development-settings }}
          package-excludes: ${{ inputs.package-excludes }}
      - name: Prepare container tools and authentication scope
        id: container-tools
        if: steps.plan.outputs.has-containers == 'true'
        shell: pwsh
        env:
          AMITH_CONTAINER_USER: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          AMITH_CONTAINER_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          AMITH_CONTAINER_RELEASE: ${{ inputs.release && steps.plan.outputs.container-release == 'true' }}
        run: |
          if ($IsWindows -or $IsMacOS) { throw 'The shared container workflow requires a Linux runner. Local Container supports any host with Buildx.' }
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) { throw 'Container builds require the Docker CLI on the runner.' }
          $hasUser = -not [string]::IsNullOrEmpty($env:AMITH_CONTAINER_USER)
          $hasPassword = -not [string]::IsNullOrEmpty($env:AMITH_CONTAINER_PASSWORD)
          if ($hasUser -ne $hasPassword) { throw 'Supply CONTAINER_REGISTRY_USERNAME and CONTAINER_REGISTRY_PASSWORD together.' }
          $config = Join-Path $env:RUNNER_TEMP ('amith-docker-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($config)
          [IO.File]::SetUnixFileMode($config, ([IO.UnixFileMode]::UserRead -bor [IO.UnixFileMode]::UserWrite -bor [IO.UnixFileMode]::UserExecute))
          [IO.File]::WriteAllText((Join-Path $config 'config.json'), '{"auths":{}}')
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOCKER_CONFIG=$config"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "authenticate=$($hasUser.ToString().ToLowerInvariant())"
          if ($env:AMITH_CONTAINER_RELEASE -eq 'true' -and -not (Get-Command skopeo -ErrorAction SilentlyContinue)) {
            if ((& id -u) -eq '0') {
              & apt-get update
              if ($LASTEXITCODE -ne 0) { throw 'Could not update package metadata for Skopeo.' }
              & apt-get install -y skopeo
            } else {
              & sudo apt-get update
              if ($LASTEXITCODE -ne 0) { throw 'Could not update package metadata for Skopeo.' }
              & sudo apt-get install -y skopeo
            }
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Skopeo.' }
          }
      - name: Authenticate container registry
        if: steps.container-tools.outputs.authenticate == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.plan.outputs.container-registry }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - name: Set up remote container builder
        id: container-builder
        if: steps.plan.outputs.has-containers == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ inputs.container-builder-endpoint }}
          version: ${{ inputs.container-buildx-version }}
      - name: Restore
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Restore
      - name: Build
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Build
      - name: Test
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Test
      - name: Pack NuGet libraries
        if: steps.plan.outputs.build-mode != 'containers'
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Pack
      - name: Publish applications
        if: steps.plan.outputs.build-mode != 'containers'
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Publish
      - name: Archive applications
        if: steps.plan.outputs.build-mode != 'containers'
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Archive
      - name: Package configured installers
        if: steps.plan.outputs.build-mode != 'containers'
        id: installer
        uses: Amith211/Amith.Build@v0.2.0
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          stage: Installer
      - name: Package container images
        id: container
        uses: Amith211/Amith.Build@v0.2.0
        env:
          AMITH_NUGET_RESTORE_SOURCES: ${{ secrets.NUGET_RESTORE_SOURCES }}
        with:
          stage: Container
          container-builder: ${{ steps.container-builder.outputs.name }}
      - name: Release
        id: release
        if: inputs.release
        uses: Amith211/Amith.Build@v0.2.0
        env:
          NUGET_SOURCE_URL: ${{ secrets.NUGET_SOURCE_URL }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        with:
          stage: Release
      - name: Select recorded artifacts for retention
        id: retain
        if: ${{ !cancelled() && steps.retention-policy.outcome == 'success' && (steps.installer.outcome == 'success' || steps.plan.outputs.build-mode == 'containers') && steps.container.outcome == 'success' && (inputs.artifact-retention == 'always' || (inputs.artifact-retention == 'auto' && (!inputs.release || steps.release.outcome == 'failure'))) }}
        uses: Amith211/Amith.Build@v0.2.0
        with:
          stage: Retain
      - name: Retain packaged artifacts
        id: upload
        if: ${{ !cancelled() && steps.retain.outcome == 'success' && steps.retain.outputs.retained-root != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ inputs.version }}
          path: ${{ steps.retain.outputs.retained-root }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}
